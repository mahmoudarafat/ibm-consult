<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ibm-consult/assets/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:8000;" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="IBM Consulting V2 — Human-Governed Quality Review Platform and Deliverable Governance Microsite" />
    <title>IBM Consulting V2 — Human-Governed Quality Review</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages URL restoration
      // MIT License - https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <script type="module" crossorigin src="/ibm-consult/assets/main.js"></script>
    <link rel="stylesheet" crossorigin href="/ibm-consult/assets/main.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
